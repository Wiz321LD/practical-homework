#PostgreSQL and DataSource config
hibernate.connection.url=jdbc:postgresql://localhost:5432/university_db
hibernate.connection.username=postgres
hibernate.connection.password=postgresql
hibernate.connection.driver_class=org.postgresql.Driver

#Hibernate config
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
show_sql=true
format_sql=true
hibernate.jdbc.batch_size=10000
hibernate.order_updates=true
hibernate.order_inserts=true
hibernate.generate_statistics=true
hibernate.cache.region_prefix_factory_class=org.hibernate.cache.jcache.internal.JCacheRegionFactory